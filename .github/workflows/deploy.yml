name: Deploy to VPS

on:
  push:
    branches: [main]
  # Allow manual re-deploy from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vps
  cancel-in-progress: false   # never abort a deploy mid-flight

jobs:
  deploy:
    name: Build & rsync to VPS
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    env:
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${VPS_PORT}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via rsync
        # IMPORTANT: VPS_PATH must point to a dedicated directory. `--delete`
        # removes any file at that path that is not in app/dist, which is what
        # we want for a clean static drop. Do not point VPS_PATH at a shared
        # location (it will be wiped).
        run: |
          rsync -avz --delete --human-readable \
            -e "ssh -i ~/.ssh/deploy_key -p ${VPS_PORT} -o StrictHostKeyChecking=accept-new" \
            dist/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PATH }}/"

      - name: Reload Nginx (optional)
        if: ${{ secrets.RELOAD_NGINX == 'true' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${VPS_PORT}" \
            -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "sudo systemctl reload nginx"
