<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="hSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a7faa"/>
      <stop offset="50%" stop-color="#e8a84a"/>
      <stop offset="100%" stop-color="#d08030"/>
    </linearGradient>
    <linearGradient id="hGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c0a850"/>
      <stop offset="100%" stop-color="#7a5818"/>
    </linearGradient>
    <linearGradient id="hRobe" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#e8e0d0"/>
      <stop offset="40%" stop-color="#c8bca8"/>
      <stop offset="100%" stop-color="#a89880"/>
    </linearGradient>
    <filter id="hAtmos">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="600" fill="url(#hSky)"/>

  <!-- Sun -->
  <circle cx="680" cy="100" r="38" fill="#ffe040" opacity="0.9"/>
  <circle cx="680" cy="100" r="70" fill="#ffc030" opacity="0.3"/>

  <!-- Background haze -->
  <ellipse cx="400" cy="380" rx="500" ry="50" fill="#e09840" opacity="0.2" filter="url(#hAtmos)"/>

  <!-- Distant acacia trees -->
  <g fill="#2d1a06" opacity="0.45">
    <rect x="40" y="300" width="6" height="80"/><ellipse cx="43" cy="295" rx="28" ry="11"/>
    <rect x="620" y="278" width="7" height="95"/><ellipse cx="623" cy="272" rx="34" ry="13"/>
    <rect x="730" y="308" width="5" height="70"/><ellipse cx="733" cy="304" rx="24" ry="9"/>
    <rect x="150" y="320" width="5" height="68"/><ellipse cx="153" cy="316" rx="22" ry="9"/>
  </g>

  <!-- Ground -->
  <rect y="390" width="800" height="210" fill="url(#hGround)"/>
  <path d="M0 408 Q200 395 400 410 Q600 426 800 406 L800 600 L0 600Z" fill="#a08030" opacity="0.5"/>

  <!-- Dust trail (herd atmosphere) -->
  <ellipse cx="600" cy="440" rx="140" ry="20" fill="#d4a040" opacity="0.25" filter="url(#hAtmos)"/>

  <!-- Background cattle herd (silhouettes) -->
  <g fill="#3a2008" opacity="0.55" transform="translate(470, 360)">
    <!-- Cattle 1 -->
    <ellipse cx="50" cy="38" rx="30" ry="16"/><rect x="38" y="52" width="6" height="20" rx="3"/><rect x="58" y="52" width="6" height="20" rx="3"/>
    <path d="M25 30 Q18 20 10 22" stroke="#3a2008" stroke-width="4" fill="none"/>
    <!-- Cattle 2 -->
    <ellipse cx="120" cy="36" rx="28" ry="14" opacity="0.8"/><rect x="109" y="48" width="5" height="18" rx="3"/><rect x="126" y="48" width="5" height="18" rx="3"/>
    <!-- Cattle 3 -->
    <ellipse cx="185" cy="40" rx="26" ry="13" opacity="0.7"/><rect x="175" y="51" width="5" height="17" rx="3"/><rect x="190" y="51" width="5" height="17" rx="3"/>
  </g>

  <!-- === FULANI HERDER === -->
  <g transform="translate(290, 130)">
    <!-- Shadow -->
    <ellipse cx="110" cy="422" rx="55" ry="10" fill="#2a1806" opacity="0.4"/>

    <!-- Staff (gandal) - long stick -->
    <line x1="165" y1="55" x2="178" y2="425" stroke="#7a5020" stroke-width="6" stroke-linecap="round"/>
    <line x1="165" y1="55" x2="178" y2="425" stroke="#9a6828" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Robe / boubou - flowing garment -->
    <!-- Main robe shape -->
    <path d="M85 145 Q65 200 58 280 Q52 345 60 420 L90 418 Q88 350 92 295 Q95 260 98 230 Q105 200 108 175Z" fill="url(#hRobe)"/>
    <path d="M135 145 Q155 200 162 280 Q168 345 160 420 L130 418 Q132 350 128 295 Q125 260 122 230 Q115 200 112 175Z" fill="url(#hRobe)"/>
    <!-- Center panel of robe -->
    <path d="M98 150 Q100 200 108 275 Q112 330 110 420 L108 420 Q106 330 100 275 Q92 200 90 150Z" fill="#d8d0be" opacity="0.7"/>
    <!-- Robe shadow/fold lines -->
    <path d="M85 160 Q78 230 75 310" stroke="#a89880" stroke-width="1.5" fill="none" opacity="0.7"/>
    <path d="M135 165 Q142 235 145 315" stroke="#a89880" stroke-width="1.5" fill="none" opacity="0.7"/>

    <!-- Arms -->
    <!-- Right arm extended (holding staff) -->
    <path d="M128 155 Q148 168 165 190 Q168 205 165 218" stroke="#8a5828" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M128 155 Q148 168 165 190 Q168 205 165 218" stroke="#b87840" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.5"/>
    <!-- Left arm at rest -->
    <path d="M92 158 Q78 178 72 198 Q70 214 74 228" stroke="#8a5828" stroke-width="12" fill="none" stroke-linecap="round"/>

    <!-- Neck -->
    <rect x="102" y="122" width="16" height="28" rx="6" fill="#8a5828"/>

    <!-- Head -->
    <ellipse cx="110" cy="105" rx="28" ry="30" fill="#7a4c20"/>
    <!-- Face shading -->
    <ellipse cx="105" cy="112" rx="18" ry="20" fill="#6a3e18" opacity="0.4"/>

    <!-- Turban / headwrap -->
    <path d="M82 95 Q88 62 110 58 Q132 56 138 80 Q142 95 140 100 Q120 110 100 108 Q84 105 82 95Z" fill="#2a4878"/>
    <path d="M82 95 Q88 72 110 68 Q130 66 138 80" stroke="#3a5a90" stroke-width="2.5" fill="none"/>
    <!-- Turban folds -->
    <path d="M86 88 Q100 78 120 82" stroke="#1a3060" stroke-width="1.5" fill="none" opacity="0.6"/>
    <!-- Turban wrap tail -->
    <path d="M138 80 Q148 75 152 82 Q148 92 140 94" fill="#2a4878"/>

    <!-- Face features -->
    <!-- Eyes -->
    <ellipse cx="102" cy="106" rx="5" ry="4" fill="#1a0c06"/>
    <ellipse cx="119" cy="106" rx="5" ry="4" fill="#1a0c06"/>
    <circle cx="103" cy="104" r="1.5" fill="white" opacity="0.6"/>
    <circle cx="120" cy="104" r="1.5" fill="white" opacity="0.6"/>
    <!-- Nose -->
    <path d="M108 112 Q110 118 112 112" stroke="#4a2a10" stroke-width="1.5" fill="none"/>
    <!-- Mouth -->
    <path d="M104 120 Q110 124 116 120" stroke="#5a3018" stroke-width="1.5" fill="none"/>

    <!-- Hands -->
    <ellipse cx="165" cy="224" rx="7" ry="9" fill="#7a4c1e"/>
    <ellipse cx="74" cy="232" rx="7" ry="9" fill="#7a4c1e"/>

    <!-- Feet (sandals visible below robe) -->
    <ellipse cx="80" cy="425" rx="18" ry="6" fill="#5a3010"/>
    <ellipse cx="132" cy="428" rx="18" ry="6" fill="#5a3010"/>
  </g>

  <!-- Grass tufts in foreground -->
  <g stroke="#8a7020" stroke-width="2" fill="none" opacity="0.8">
    <path d="M20 445 Q24 420 28 445M42 452 Q46 427 50 452M65 440 Q69 415 73 440"/>
    <path d="M700 442 Q704 417 708 442M722 450 Q726 425 730 450"/>
    <path d="M760 446 Q764 421 768 446M778 454 Q782 429 786 454"/>
  </g>

  <text x="400" y="577" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#c8a040" opacity="0.75" letter-spacing="3">GAYNAAKO · PULAAGU</text>
</svg>
