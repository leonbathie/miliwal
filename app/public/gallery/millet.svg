<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="mSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4090c8"/>
      <stop offset="70%" stop-color="#a0c8e8"/>
      <stop offset="100%" stop-color="#d8c880"/>
    </linearGradient>
    <linearGradient id="mGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a9830"/>
      <stop offset="100%" stop-color="#604820"/>
    </linearGradient>
    <linearGradient id="mStem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6a8820"/>
      <stop offset="50%" stop-color="#8aaa30"/>
      <stop offset="100%" stop-color="#6a8820"/>
    </linearGradient>
    <linearGradient id="mHead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a020"/>
      <stop offset="50%" stop-color="#a87818"/>
      <stop offset="100%" stop-color="#6a4c10"/>
    </linearGradient>
    <filter id="mBlur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="600" fill="url(#mSky)"/>

  <!-- Sun -->
  <circle cx="120" cy="90" r="38" fill="#ffe060" opacity="0.85"/>
  <circle cx="120" cy="90" r="65" fill="#ffcc30" opacity="0.25"/>

  <!-- Clouds -->
  <g fill="white" opacity="0.65">
    <ellipse cx="350" cy="80" rx="80" ry="22"/>
    <ellipse cx="290" cy="78" rx="55" ry="16"/>
    <ellipse cx="600" cy="65" rx="90" ry="25"/>
    <ellipse cx="660" cy="68" rx="60" ry="18"/>
  </g>

  <!-- Far horizon millet field -->
  <path d="M0 360 Q200 345 400 358 Q600 372 800 350 L800 400 L0 400Z" fill="#7a9028" opacity="0.6"/>

  <!-- Ground -->
  <rect y="390" width="800" height="210" fill="url(#mGround)"/>
  <path d="M0 408 Q200 395 400 410 Q600 424 800 402 L800 600 L0 600Z" fill="#785030" opacity="0.5"/>

  <!-- Soil furrows -->
  <g stroke="#6a4820" stroke-width="2" opacity="0.4">
    <path d="M0 438 Q200 425 400 440 Q600 455 800 435"/>
    <path d="M0 458 Q200 445 400 460 Q600 475 800 455"/>
    <path d="M0 478 Q200 465 400 480 Q600 495 800 475"/>
  </g>

  <!-- === MILLET STALKS (foreground) === -->
  <!-- Helper macro: draw one millet plant at position with height variation -->

  <!-- Stalk 1 -->
  <g transform="translate(85, 105)">
    <path d="M0 360 Q-8 280 -5 200 Q-3 140 0 80 Q3 40 5 0" stroke="#7a9828" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M0 360 Q8 280 6 200 Q5 140 3 80" stroke="#9ab838" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
    <!-- Leaves -->
    <path d="M0 280 Q-35 255 -50 240 Q-30 260 0 275" fill="#88a828"/>
    <path d="M0 230 Q30 205 48 188 Q28 210 0 222" fill="#7a9820"/>
    <path d="M0 160 Q-28 138 -42 122 Q-25 142 0 152" fill="#88a828"/>
    <!-- Grain head (panicle) -->
    <path d="M5 0 Q0 -40 -3 -75 Q-1 -105 0 -130" stroke="url(#mHead)" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Grain clusters on panicle -->
    <g fill="#c89820" opacity="0.85">
      <ellipse cx="-8" cy="-32" rx="10" ry="5" transform="rotate(-15,-8,-32)"/>
      <ellipse cx="5" cy="-48" rx="10" ry="5" transform="rotate(10,5,-48)"/>
      <ellipse cx="-10" cy="-62" rx="9" ry="4.5" transform="rotate(-20,-10,-62)"/>
      <ellipse cx="4" cy="-76" rx="9" ry="4.5" transform="rotate(8,4,-76)"/>
      <ellipse cx="-6" cy="-88" rx="8" ry="4" transform="rotate(-10,-6,-88)"/>
      <ellipse cx="3" cy="-100" rx="7" ry="3.5" transform="rotate(5,3,-100)"/>
      <ellipse cx="-2" cy="-115" rx="6" ry="3" transform="rotate(-5,-2,-115)"/>
    </g>
  </g>

  <!-- Stalk 2 (taller) -->
  <g transform="translate(195, 80)">
    <path d="M0 380 Q5 290 3 210 Q1 140 0 70 Q-1 30 2 -10" stroke="#8aaa30" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M0 300 Q-32 272 -46 255 Q-28 278 0 290" fill="#78a020"/>
    <path d="M0 200 Q28 178 44 162 Q26 183 0 192" fill="#8aaa28"/>
    <path d="M0 130 Q-24 108 -36 95 Q-20 115 0 124" fill="#78a020"/>
    <!-- Grain head -->
    <path d="M2 -10 Q-2 -52 -1 -90 Q0 -118 0 -145" stroke="url(#mHead)" stroke-width="8" fill="none" stroke-linecap="round"/>
    <g fill="#d4a828" opacity="0.88">
      <ellipse cx="-10" cy="-42" rx="11" ry="5" transform="rotate(-18,-10,-42)"/>
      <ellipse cx="6" cy="-58" rx="11" ry="5" transform="rotate(12,6,-58)"/>
      <ellipse cx="-9" cy="-72" rx="10" ry="4.5" transform="rotate(-15,-9,-72)"/>
      <ellipse cx="5" cy="-85" rx="10" ry="4.5"/>
      <ellipse cx="-6" cy="-98" rx="9" ry="4"/>
      <ellipse cx="4" cy="-112" rx="8" ry="3.5"/>
      <ellipse cx="-2" cy="-128" rx="7" ry="3" transform="rotate(-8,-2,-128)"/>
      <ellipse cx="2" cy="-140" rx="6" ry="3"/>
    </g>
  </g>

  <!-- Stalk 3 -->
  <g transform="translate(315, 95)">
    <path d="M0 370 Q-6 295 -4 225 Q-2 158 0 90 Q2 48 1 0" stroke="#7a9828" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M0 285 Q30 258 45 242 Q27 262 0 275" fill="#88aa28"/>
    <path d="M0 185 Q-28 162 -42 148 Q-24 168 0 178" fill="#7aa020"/>
    <path d="M0 110 Q26 88 40 74 Q23 93 0 102" fill="#88aa28"/>
    <!-- Grain head -->
    <path d="M1 0 Q3 -38 2 -72 Q1 -100 0 -125" stroke="url(#mHead)" stroke-width="7" fill="none" stroke-linecap="round"/>
    <g fill="#c09018" opacity="0.85">
      <ellipse cx="-7" cy="-30" rx="10" ry="5" transform="rotate(-12,-7,-30)"/>
      <ellipse cx="5" cy="-45" rx="10" ry="4.5" transform="rotate(10,5,-45)"/>
      <ellipse cx="-8" cy="-58" rx="9" ry="4"/>
      <ellipse cx="4" cy="-70" rx="9" ry="4"/>
      <ellipse cx="-5" cy="-82" rx="8" ry="3.5"/>
      <ellipse cx="3" cy="-95" rx="7" ry="3"/>
      <ellipse cx="-1" cy="-110" rx="6" ry="3"/>
    </g>
  </g>

  <!-- Stalk 4 (leaning slightly) -->
  <g transform="translate(430, 90) rotate(4)">
    <path d="M0 375 Q-4 300 -3 230 Q-2 162 0 95 Q1 50 0 0" stroke="#8aaa30" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M0 290 Q-30 265 -44 248 Q-26 268 0 280" fill="#78a020"/>
    <path d="M0 195 Q26 172 40 157 Q23 177 0 188" fill="#8aaa28"/>
    <!-- Grain head -->
    <path d="M0 0 Q2 -42 1 -78 Q0 -108 0 -138" stroke="url(#mHead)" stroke-width="7.5" fill="none" stroke-linecap="round"/>
    <g fill="#d4a820" opacity="0.9">
      <ellipse cx="-9" cy="-34" rx="11" ry="5" transform="rotate(-16,-9,-34)"/>
      <ellipse cx="6" cy="-50" rx="11" ry="5"/>
      <ellipse cx="-8" cy="-64" rx="10" ry="4.5"/>
      <ellipse cx="5" cy="-78" rx="10" ry="4"/>
      <ellipse cx="-6" cy="-91" rx="9" ry="4"/>
      <ellipse cx="3" cy="-105" rx="8" ry="3.5"/>
      <ellipse cx="-3" cy="-118" rx="7" ry="3"/>
      <ellipse cx="2" cy="-130" rx="6" ry="3"/>
    </g>
  </g>

  <!-- Stalk 5 -->
  <g transform="translate(545, 115)">
    <path d="M0 355 Q6 282 4 215 Q2 150 0 85 Q-2 42 0 -5" stroke="#7a9828" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M0 270 Q28 248 40 232 Q24 252 0 262" fill="#88aa28"/>
    <path d="M0 180 Q-25 158 -38 144 Q-21 164 0 173" fill="#7aa020"/>
    <!-- Grain head -->
    <path d="M0 -5 Q-2 -42 -1 -75 Q0 -105 0 -130" stroke="url(#mHead)" stroke-width="7" fill="none" stroke-linecap="round"/>
    <g fill="#c89018" opacity="0.85">
      <ellipse cx="-8" cy="-34" rx="10" ry="5" transform="rotate(-14,-8,-34)"/>
      <ellipse cx="5" cy="-49" rx="10" ry="4.5"/>
      <ellipse cx="-7" cy="-62" rx="9" ry="4"/>
      <ellipse cx="4" cy="-74" rx="9" ry="3.8"/>
      <ellipse cx="-5" cy="-86" rx="8" ry="3.5"/>
      <ellipse cx="3" cy="-98" rx="7" ry="3"/>
      <ellipse cx="-2" cy="-112" rx="6" ry="2.8"/>
    </g>
  </g>

  <!-- Stalk 6 (rightmost) -->
  <g transform="translate(660, 100)">
    <path d="M0 365 Q-5 290 -3 220 Q-1 155 0 88 Q2 45 0 0" stroke="#8aaa30" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M0 280 Q-28 256 -42 240 Q-24 260 0 270" fill="#78a020"/>
    <path d="M0 190 Q25 168 38 153 Q22 172 0 182" fill="#8aaa28"/>
    <path d="M0 118 Q-22 98 -34 85 Q-18 104 0 112" fill="#78a020"/>
    <!-- Grain head -->
    <path d="M0 0 Q2 -40 1 -76 Q0 -106 0 -135" stroke="url(#mHead)" stroke-width="7.5" fill="none" stroke-linecap="round"/>
    <g fill="#d4a820" opacity="0.88">
      <ellipse cx="-9" cy="-32" rx="11" ry="5" transform="rotate(-18,-9,-32)"/>
      <ellipse cx="6" cy="-48" rx="11" ry="5"/>
      <ellipse cx="-8" cy="-62" rx="10" ry="4.5"/>
      <ellipse cx="5" cy="-75" rx="10" ry="4"/>
      <ellipse cx="-6" cy="-88" rx="9" ry="4"/>
      <ellipse cx="3" cy="-102" rx="8" ry="3.5"/>
      <ellipse cx="-2" cy="-116" rx="7" ry="3"/>
      <ellipse cx="2" cy="-128" rx="6" ry="3"/>
    </g>
  </g>

  <!-- Background millet stalks (simplified, distant) -->
  <g opacity="0.45" stroke="#6a8818" stroke-width="3" fill="none">
    <path d="M30 420 Q28 350 30 285 Q32 240 30 195"/>
    <path d="M750 410 Q748 342 750 278 Q752 234 750 188"/>
    <path d="M760 415 Q762 348 760 282 Q758 238 760 192"/>
  </g>
  <g fill="#b08818" opacity="0.4">
    <ellipse cx="30" cy="175" rx="8" ry="22"/>
    <ellipse cx="750" cy="168" rx="8" ry="22"/>
    <ellipse cx="760" cy="172" rx="7" ry="20"/>
  </g>

  <text x="400" y="577" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#a08020" opacity="0.8" letter-spacing="3">GAWRI · KAWLE</text>
</svg>
