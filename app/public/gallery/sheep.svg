<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6eacd6"/>
      <stop offset="60%" stop-color="#b8d8e8"/>
      <stop offset="100%" stop-color="#d4c88a"/>
    </linearGradient>
    <linearGradient id="sGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#98b040"/>
      <stop offset="40%" stop-color="#b09040"/>
      <stop offset="100%" stop-color="#786020"/>
    </linearGradient>
    <radialGradient id="sWool" cx="40%" cy="30%">
      <stop offset="0%" stop-color="#f5f0e8"/>
      <stop offset="50%" stop-color="#ddd8cc"/>
      <stop offset="100%" stop-color="#bab4a8"/>
    </radialGradient>
    <filter id="sSoftBlur">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="600" fill="url(#sSky)"/>

  <!-- Clouds -->
  <g fill="white" opacity="0.75">
    <ellipse cx="180" cy="90" rx="80" ry="25"/>
    <ellipse cx="130" cy="88" rx="50" ry="18"/>
    <ellipse cx="220" cy="92" rx="55" ry="20"/>
    <ellipse cx="580" cy="75" rx="90" ry="28"/>
    <ellipse cx="530" cy="73" rx="55" ry="20"/>
    <ellipse cx="630" cy="77" rx="60" ry="22"/>
  </g>

  <!-- Far ground / horizon -->
  <path d="M0 370 Q150 355 350 368 Q500 380 650 360 Q730 352 800 365 L800 410 L0 410Z" fill="#8a9830" opacity="0.7"/>
  <path d="M0 378 Q200 363 400 376 Q600 390 800 372 L800 415 L0 415Z" fill="#78882a" opacity="0.5"/>

  <!-- Ground -->
  <rect y="405" width="800" height="195" fill="url(#sGround)"/>
  <path d="M0 422 Q200 408 400 425 Q600 442 800 420 L800 600 L0 600Z" fill="#8a7828" opacity="0.5"/>

  <!-- Small shrubs background -->
  <g fill="#5a7018" opacity="0.5">
    <ellipse cx="80" cy="375" rx="28" ry="12"/>
    <ellipse cx="680" cy="370" rx="30" ry="13"/>
    <ellipse cx="740" cy="380" rx="20" ry="9"/>
    <ellipse cx="120" cy="382" rx="18" ry="8"/>
  </g>

  <!-- === WEST AFRICAN SHEEP (Balami) === -->
  <!-- SHEEP 1 - main, foreground -->
  <g transform="translate(170, 250)">
    <!-- Shadow -->
    <ellipse cx="185" cy="258" rx="140" ry="16" fill="#3a3010" opacity="0.3"/>

    <!-- Wool body - fluffy, layered ellipses -->
    <ellipse cx="185" cy="168" rx="138" ry="100" fill="url(#sWool)"/>
    <!-- Wool texture bumps -->
    <ellipse cx="100" cy="120" rx="60" ry="48" fill="#ede8e0" opacity="0.7"/>
    <ellipse cx="180" cy="108" rx="65" ry="52" fill="#f0ece4" opacity="0.7"/>
    <ellipse cx="255" cy="125" rx="58" ry="46" fill="#e8e4dc" opacity="0.7"/>
    <ellipse cx="130" cy="155" rx="55" ry="42" fill="#f2efe8" opacity="0.6"/>
    <ellipse cx="215" cy="148" rx="52" ry="40" fill="#ede9e2" opacity="0.6"/>
    <ellipse cx="165" cy="138" rx="60" ry="48" fill="#f5f2ea" opacity="0.5"/>

    <!-- Neck -->
    <path d="M65 150 Q40 120 48 95 Q55 72 75 78 Q90 82 95 108 Q90 130 80 145Z" fill="#c8c0b0"/>

    <!-- Head (darker, less wool) -->
    <ellipse cx="42" cy="88" rx="36" ry="30" fill="#2a1a08"/>
    <!-- Head coloring (Balami typically has dark face) -->
    <ellipse cx="40" cy="92" rx="30" ry="24" fill="#1e1406"/>

    <!-- Ears -->
    <path d="M35 72 Q18 50 26 68" fill="#3a2810" stroke="#2a1e0a" stroke-width="1"/>
    <path d="M65 70 Q78 48 70 66" fill="#3a2810" stroke="#2a1e0a" stroke-width="1"/>

    <!-- Snout/muzzle -->
    <ellipse cx="18" cy="100" rx="18" ry="12" fill="#3a2810"/>
    <!-- Nostrils -->
    <ellipse cx="12" cy="103" r="3" fill="#0e0a06"/>
    <ellipse cx="22" cy="104" r="3" fill="#0e0a06"/>

    <!-- Mouth -->
    <path d="M12 110 Q18 114 24 110" stroke="#1a1008" stroke-width="1.5" fill="none"/>

    <!-- Eyes -->
    <ellipse cx="50" cy="82" rx="7" ry="6" fill="#1a1206"/>
    <circle cx="48" cy="81" r="4" fill="#0a0806"/>
    <circle cx="50" cy="79" r="1.5" fill="white" opacity="0.6"/>

    <!-- Horns (rams have curved horns) -->
    <path d="M36 68 Q22 42 28 22 Q38 8 50 18 Q58 28 48 42" stroke="#7a5820" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M62 66 Q76 42 70 22 Q60 8 48 18" stroke="#6a4c18" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>

    <!-- Legs -->
    <rect x="100" y="252" width="20" height="72" rx="6" fill="#c8c0b0"/>
    <rect x="142" y="252" width="18" height="75" rx="6" fill="#bab4a5"/>
    <rect x="218" y="252" width="20" height="72" rx="6" fill="#c8c0b0"/>
    <rect x="255" y="252" width="18" height="70" rx="6" fill="#bab4a5"/>
    <!-- Hooves -->
    <rect x="100" y="318" width="20" height="12" rx="4" fill="#2a2010"/>
    <rect x="142" y="322" width="18" height="11" rx="4" fill="#2a2010"/>
    <rect x="218" y="318" width="20" height="12" rx="4" fill="#2a2010"/>
    <rect x="255" y="316" width="18" height="11" rx="4" fill="#2a2010"/>

    <!-- Tail (small, upturned) -->
    <path d="M318 165 Q340 150 338 170 Q335 185 322 188" fill="#ddd8cc" stroke="#c8c0b0" stroke-width="1"/>
  </g>

  <!-- SHEEP 2 - smaller, background right -->
  <g transform="translate(530, 310)" opacity="0.7">
    <ellipse cx="95" cy="0" rx="95" ry="65" fill="#dedacf"/>
    <!-- Simple face -->
    <ellipse cx="15" cy="-10" rx="25" ry="22" fill="#2a1a08"/>
    <!-- Legs -->
    <rect x="25" y="55" width="14" height="45" rx="5" fill="#c0b8a8"/>
    <rect x="55" y="55" width="12" height="48" rx="5" fill="#b0a898"/>
    <rect x="120" y="55" width="14" height="45" rx="5" fill="#c0b8a8"/>
    <rect x="148" y="55" width="12" height="44" rx="5" fill="#b0a898"/>
    <ellipse cx="95" cy="100" rx="80" ry="10" fill="#3a3010" opacity="0.2"/>
  </g>

  <!-- Grass in foreground -->
  <g stroke="#6a8020" stroke-width="2" fill="none" opacity="0.8">
    <path d="M20 445 Q24 418 28 445M40 452 Q44 425 48 452M62 438 Q66 411 70 438M78 448 Q82 421 86 448"/>
    <path d="M680 440 Q684 413 688 440M700 448 Q704 421 708 448M718 436 Q722 409 726 436"/>
  </g>
  <!-- Some dry grass -->
  <g stroke="#c8a030" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M110 455 Q114 432 118 455M130 462 Q134 439 138 462"/>
    <path d="M620 452 Q624 429 628 452M638 460 Q642 437 646 460"/>
  </g>

  <text x="400" y="577" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#8a7030" opacity="0.8" letter-spacing="3">MBAALU NDU · BALAMI</text>
</svg>
