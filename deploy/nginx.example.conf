# Example Nginx site configuration for Pulaagu / Calendrier Fulfulde
# ---------------------------------------------------------------------------
# Place this file in /etc/nginx/sites-available/miliwal.conf,
# enable with: ln -s /etc/nginx/sites-available/miliwal.conf /etc/nginx/sites-enabled/
# Test:      sudo nginx -t
# Reload:    sudo systemctl reload nginx
#
# Customize: replace `your-domain.example` with your actual domain, and the
# `root` path with the same value as the VPS_PATH secret on GitHub.
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example;

    root /var/www/miliwal;
    index index.html;

    # Compress text assets on the fly. Make sure gzip is enabled in nginx.conf.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # ---- Long-lived caching for hashed assets (Vite outputs index-XXX.js, etc.) ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- Never cache the service worker, manifest, or index.html ----
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # ---- SPA fallback: anything else -> index.html ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Security headers ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
}

# ---------------------------------------------------------------------------
# HTTPS variant (recommended). Run `sudo certbot --nginx -d your-domain.example`
# after the HTTP block above is live; certbot will rewrite this file to add the
# 443 listener and redirect 80 → 443 automatically.
# ---------------------------------------------------------------------------
